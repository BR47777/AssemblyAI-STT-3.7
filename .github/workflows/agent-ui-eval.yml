name: Agent UI evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline end-to-end evaluations
        run: python -m unittest discover -s agent-ui/tests -v
      - name: Validate browser app and PCM worklet
        run: node agent-ui/tests/check_frontend.js
